name: Strip PR Footer

# The GitHub MCP integration appends a "_Generated by [Claude Code](...)_"
# footer to PR bodies at creation time, server-side — the repo's
# .claude/settings.json attribution settings cannot prevent it. This workflow
# removes that footer from every PR body so it never lands on a PR into dev.
#
# Edits made with GITHUB_TOKEN do not trigger further workflow runs, so the
# rewrite below cannot loop.

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  strip-pr-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Remove the Claude Code attribution footer from the PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Nothing to do for an empty body.
          if [ -z "$PR_BODY" ]; then
            echo "PR body is empty; nothing to strip."
            exit 0
          fi

          printf '%s' "$PR_BODY" > body.txt

          # Strip a trailing "_Generated by [Claude Code](...)_" line and the
          # optional "---" rule before it. Anchored to the end of the body so it
          # never touches a horizontal rule that is part of the description.
          perl -0777 -pe 's/\n+(---\n)?_Generated by \[Claude Code\]\([^)]*\)_\s*\z//' body.txt > cleaned.txt

          if cmp -s body.txt cleaned.txt; then
            echo "No Claude Code footer found; leaving the body unchanged."
            exit 0
          fi

          echo "Footer found; rewriting the PR body."
          gh pr edit "$PR_NUMBER" --repo "$REPO" --body-file cleaned.txt
