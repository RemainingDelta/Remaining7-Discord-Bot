[project]
name = "remaining7-discord-bot"
version = "1.12.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# Pin the ruleset explicitly so `ruff check` is deterministic across ruff
# versions (CI installs ruff unpinned). This is ruff's historical default set.
select = ["E4", "E7", "E9", "F"]
